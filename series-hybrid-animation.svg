<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">串联式涡轮混电能量流动画</title><desc id="desc">起飞助推教学示意。燃机带发电机，经整流向母线供电；电池经双向变换器补充功率；母线经逆变器和电机驱动双螺旋桨，无燃机到桨的直接机械连接。</desc><rect width="1600" height="900" fill="#f4f5ee"/><g font-family="Microsoft YaHei, sans-serif" fill="#284c42"><text x="75" y="77" font-size="16" letter-spacing="4">HYBRID ATLAS / ENERGY IN MOTION</text><text x="75" y="144" font-size="44" font-weight="bold">串联式涡轮混电：跟随能量，抵达推力。</text><text x="75" y="185" font-size="20" fill="#728579">起飞助推 · 固定工况示意 · 非实机参数 / 非 CFD</text></g><path d="M290 352 H375" fill="none" stroke="#8796a2" stroke-width="5" stroke-opacity=".4"/><circle r="6" fill="#8796a2"><animateMotion dur="2s" begin="-0s" repeatCount="indefinite" path="M290 352 H375"/></circle><circle r="6" fill="#8796a2"><animateMotion dur="2s" begin="-0.5s" repeatCount="indefinite" path="M290 352 H375"/></circle><circle r="6" fill="#8796a2"><animateMotion dur="2s" begin="-1s" repeatCount="indefinite" path="M290 352 H375"/></circle><circle r="6" fill="#8796a2"><animateMotion dur="2s" begin="-1.5s" repeatCount="indefinite" path="M290 352 H375"/></circle><path d="M530 352 H610" fill="none" stroke="#188978" stroke-width="5" stroke-opacity=".4"/><circle r="6" fill="#188978"><animateMotion dur="2s" begin="-0s" repeatCount="indefinite" path="M530 352 H610"/></circle><circle r="6" fill="#188978"><animateMotion dur="2s" begin="-0.5s" repeatCount="indefinite" path="M530 352 H610"/></circle><circle r="6" fill="#188978"><animateMotion dur="2s" begin="-1s" repeatCount="indefinite" path="M530 352 H610"/></circle><circle r="6" fill="#188978"><animateMotion dur="2s" begin="-1.5s" repeatCount="indefinite" path="M530 352 H610"/></circle><path d="M760 352 H845" fill="none" stroke="#188978" stroke-width="5" stroke-opacity=".4"/><circle r="6" fill="#188978"><animateMotion dur="2s" begin="-0s" repeatCount="indefinite" path="M760 352 H845"/></circle><circle r="6" fill="#188978"><animateMotion dur="2s" begin="-0.5s" repeatCount="indefinite" path="M760 352 H845"/></circle><circle r="6" fill="#188978"><animateMotion dur="2s" begin="-1s" repeatCount="indefinite" path="M760 352 H845"/></circle><circle r="6" fill="#188978"><animateMotion dur="2s" begin="-1.5s" repeatCount="indefinite" path="M760 352 H845"/></circle><path d="M1010 352 H1110" fill="none" stroke="#188978" stroke-width="5" stroke-opacity=".4"/><circle r="6" fill="#188978"><animateMotion dur="2s" begin="-0s" repeatCount="indefinite" path="M1010 352 H1110"/></circle><circle r="6" fill="#188978"><animateMotion dur="2s" begin="-0.5s" repeatCount="indefinite" path="M1010 352 H1110"/></circle><circle r="6" fill="#188978"><animateMotion dur="2s" begin="-1s" repeatCount="indefinite" path="M1010 352 H1110"/></circle><circle r="6" fill="#188978"><animateMotion dur="2s" begin="-1.5s" repeatCount="indefinite" path="M1010 352 H1110"/></circle><path d="M1290 352 H1360" fill="none" stroke="#188978" stroke-width="5" stroke-opacity=".4"/><circle r="6" fill="#188978"><animateMotion dur="2s" begin="-0s" repeatCount="indefinite" path="M1290 352 H1360"/></circle><circle r="6" fill="#188978"><animateMotion dur="2s" begin="-0.5s" repeatCount="indefinite" path="M1290 352 H1360"/></circle><circle r="6" fill="#188978"><animateMotion dur="2s" begin="-1s" repeatCount="indefinite" path="M1290 352 H1360"/></circle><circle r="6" fill="#188978"><animateMotion dur="2s" begin="-1.5s" repeatCount="indefinite" path="M1290 352 H1360"/></circle><path d="M575 630 H650" fill="none" stroke="#9565ac" stroke-width="5" stroke-opacity=".4"/><circle r="6" fill="#9565ac"><animateMotion dur="2s" begin="-0s" repeatCount="indefinite" path="M575 630 H650"/></circle><circle r="6" fill="#9565ac"><animateMotion dur="2s" begin="-0.5s" repeatCount="indefinite" path="M575 630 H650"/></circle><circle r="6" fill="#9565ac"><animateMotion dur="2s" begin="-1s" repeatCount="indefinite" path="M575 630 H650"/></circle><circle r="6" fill="#9565ac"><animateMotion dur="2s" begin="-1.5s" repeatCount="indefinite" path="M575 630 H650"/></circle><path d="M850 630 H927 V400" fill="none" stroke="#9565ac" stroke-width="5" stroke-opacity=".4"/><circle r="6" fill="#9565ac"><animateMotion dur="2s" begin="-0s" repeatCount="indefinite" path="M850 630 H927 V400"/></circle><circle r="6" fill="#9565ac"><animateMotion dur="2s" begin="-0.5s" repeatCount="indefinite" path="M850 630 H927 V400"/></circle><circle r="6" fill="#9565ac"><animateMotion dur="2s" begin="-1s" repeatCount="indefinite" path="M850 630 H927 V400"/></circle><circle r="6" fill="#9565ac"><animateMotion dur="2s" begin="-1.5s" repeatCount="indefinite" path="M850 630 H927 V400"/></circle><path d="M1447 400 V515" fill="none" stroke="#8796a2" stroke-width="5" stroke-opacity=".4"/><circle r="6" fill="#8796a2"><animateMotion dur="2s" begin="-0s" repeatCount="indefinite" path="M1447 400 V515"/></circle><circle r="6" fill="#8796a2"><animateMotion dur="2s" begin="-0.5s" repeatCount="indefinite" path="M1447 400 V515"/></circle><circle r="6" fill="#8796a2"><animateMotion dur="2s" begin="-1s" repeatCount="indefinite" path="M1447 400 V515"/></circle><circle r="6" fill="#8796a2"><animateMotion dur="2s" begin="-1.5s" repeatCount="indefinite" path="M1447 400 V515"/></circle><rect x="80" y="305" width="210" height="95" rx="12" fill="#f9ecd7" stroke="#a7bcae"/><text x="185" y="362" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#284c42">燃气轮机</text><rect x="375" y="305" width="155" height="95" rx="12" fill="#e3ece4" stroke="#a7bcae"/><text x="452.5" y="362" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#284c42">发电机</text><rect x="610" y="305" width="150" height="95" rx="12" fill="#e3ece4" stroke="#a7bcae"/><text x="685" y="362" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#284c42">整流器</text><rect x="845" y="305" width="165" height="95" rx="12" fill="#cee1d5" stroke="#a7bcae"/><text x="927.5" y="362" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#284c42">直流母线</text><rect x="375" y="580" width="200" height="100" rx="12" fill="#eee3f5" stroke="#a7bcae"/><text x="475" y="637" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#284c42">电池组</text><rect x="650" y="580" width="200" height="100" rx="12" fill="#eee3f5" stroke="#a7bcae"/><text x="750" y="637" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#284c42">双向 DC/DC</text><rect x="1110" y="305" width="180" height="95" rx="12" fill="#e3ece4" stroke="#a7bcae"/><text x="1200" y="362" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#284c42">逆变器 ×2</text><rect x="1360" y="305" width="175" height="95" rx="12" fill="#e3ece4" stroke="#a7bcae"/><text x="1447.5" y="362" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#284c42">电动机 ×2</text><g transform="translate(1447 594)"><g fill="#64838a"><ellipse cy="-43" rx="10" ry="43"/><ellipse cy="43" rx="10" ry="43"/><ellipse cx="-43" rx="43" ry="10"/><ellipse cx="43" rx="43" ry="10"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/></g><circle r="14" fill="#c6af66"/></g><g font-family="Microsoft YaHei,sans-serif" fill="#557563" font-size="18"><text x="315" y="290">机械轴</text><text x="545" y="290">交流</text><text x="775" y="290">直流</text><text x="1015" y="290">直流</text><text x="1300" y="290">交流</text><text x="1110" y="460">电功率 → 电磁转矩 → 推力</text><text x="1360" y="711">双推进器示意</text><text x="375" y="727" fill="#9565ac">电池放电补充峰值功率；充电工况中紫色路径反向。</text><text x="80" y="465" fill="#a16b39">燃料 → 高温燃气 → 轴功</text></g><rect x="75" y="778" width="1460" height="60" rx="8" fill="#e2eadc"/><text x="805" y="816" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#386149">燃机与推进桨之间没有直接机械轴连接；三维图谱中可切换工况观察充放电方向。</text></svg>
